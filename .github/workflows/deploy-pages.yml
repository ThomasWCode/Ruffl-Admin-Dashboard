name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: github.event_name == 'workflow_dispatch'
        run: npm run lint
      - if: github.event_name == 'workflow_dispatch'
        run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://backend.ruffl.thomaswhite.me
          VITE_BASE_PATH: /
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ruffl-admin@${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify custom-domain bundle
        env:
          ADMIN_URL: https://admin.ruffl.thomaswhite.me
          BACKEND_URL: https://backend.ruffl.thomaswhite.me
        run: |
          for attempt in {1..12}; do
            html="$(curl --fail --silent --show-error "$ADMIN_URL/" || true)"
            asset_path="$(printf '%s' "$html" | grep --only-matching --extended-regexp 'src="/assets/[^"]+\.js"' | head --lines=1 | cut --delimiter='"' --fields=2 || true)"
            bundle=""
            if [ -n "$asset_path" ]; then
              bundle="$(curl --fail --silent --show-error "$ADMIN_URL$asset_path" || true)"
            fi
            if [ -n "$bundle" ] && printf '%s' "$bundle" | grep --fixed-strings --quiet "$BACKEND_URL"; then
              exit 0
            fi
            sleep 5
          done
          echo "The custom-domain JavaScript bundle did not use the production backend."
          exit 1
